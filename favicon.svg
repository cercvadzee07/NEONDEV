    <circle cx="442" cy="180" r="8" fill="#ff007f" />
    <circle cx="432" cy="256" r="8" fill="#ff007f" />
    <circle cx="442" cy="332" r="8" fill="#ff007f" />

    <!-- კომპასის წვეტები -->
