<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- კიბერპანკ გრადიენტები -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- მუქი კიბერპანკ ფონი (1:1 კვადრატი) -->
  <rect width="512" height="512" rx="100" fill="#0f111a" />
  
  <!-- ფონის ნაზი ბადე -->
  <path d="M0 128h512M0 256h512M0 384h512M128 0v512M256 0v512M384 0v512" stroke="rgba(125,207,255,0.06)" stroke-width="2" />

  <!-- გარე მანათობელი კომპასი და რკალი -->
  <g filter="url(#neonGlow)">
    <!-- მიკროსქემის ხაზები მარცხნივ -->
    <path d="M170 200h-50l-20-20h-30M160 256h-80M170 312h-50l-20 20h-30" stroke="#7dcfff" stroke-width="6" fill="none" stroke-linecap="round" />
    <circle cx="70" cy="180" r="7" fill="#7dcfff" />
    <circle cx="80" cy="256" r="7" fill="#7dcfff" />
    <circle cx="70" cy="332" r="7" fill="#7dcfff" />

    <!-- მიკროსქემის ხაზები მარჯვნივ -->
    <path d="M342 200h50l20-20h30M352 256h80M342 312h50l20 20h30" stroke="#ff007f" stroke-width="6" fill="none" stroke-linecap="round" />
    <circle cx="442" cy="180" r="7" fill="#ff007f" />
    <circle cx="432" cy="256" r="7" fill="#ff007f" />
    <circle cx="442" cy="332" r="7" fill="#ff007f" />

    <!-- კომპასის წვეტები -->
    <path d="M256 90l18 45h-36zM256 422l18-45h-36zM90 256l45-18v36zM422 256l-45-18v36z" fill="url(#cyberGrad)" />

    <!-- ცენტრალური რგოლები -->
    <circle cx="256" cy="256" r="115" stroke="url(#cyberGrad)" stroke-width="8" fill="none" />
    <circle cx="256" cy="256" r="95" stroke="rgba(187,154,247,0.4)" stroke-width="3" fill="#16161e" />

    <!-- ცენტრალური კოდის სიმბოლო </> -->
    <path d="M225 220l-35 36 35 36M287 220l35 36-35 36" stroke="#7dcfff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="268" y1="210" x2="244" y2="302" stroke="#bb9af7" stroke-width="10" stroke-linecap="round" />

    <!-- სამიზნე რადიარები (Crosshairs) -->
    <circle cx="390" cy="130" r="16" stroke="#ff007f" stroke-width="3" fill="none" opacity="0.8" />
    <line x1="390" y1="106" x2="390" y2="154" stroke="#ff007f" stroke-width="3" opacity="0.8" />
    <line x1="366" y1="130" x2="414" y2="130" stroke="#ff007f" stroke-width="3" opacity="0.8" />
  </g>
</svg>